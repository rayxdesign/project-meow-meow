<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Breed Explorer</title>
<meta name="description" content="An interactive, flip-card game for exploring cat breeds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <span class="hero-badge">🐾</span>
    <h1>Cat Breed Explorer</h1>
    <p class="tagline" id="tagline">Loading a lineup of cats to meet…</p>
    <div class="controls">
      <button class="btn btn-primary" id="randomBtn" type="button" disabled>🎲 Surprise Me</button>
      <a class="btn btn-secondary" href="all-breeds.html" target="_blank" rel="noopener noreferrer">📜 View All Breeds ↗</a>
    </div>
  </header>

  <main>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="status">
          <span class="paws">🐾 🐾 🐾</span>
          <div>Rounding up some cats…</div>
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" type="button" disabled>◀ Back</button>
        <div class="progress" id="progress">– / –</div>
        <button class="nav-btn" id="nextBtn" type="button" disabled>Next ▶</button>
      </div>
    </div>
  </main>

  <footer>
    Breed info &amp; photos via TheCatAPI · made for cat people 🐱
  </footer>

  <script src="js/breeds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
